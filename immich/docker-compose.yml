  immich-kiosk:
    container_name: immich_kiosk
    depends_on:
      - immich-server
    env_file:
      - docker-compose.env
    image: ghcr.io/damongolding/immich-kiosk:latest
    tty: true
    volumes:
      - ./config:/config
    restart: always
    networks:
      - caddy
      - immich
    healthcheck:
      test: ["CMD", "curl", "-f", "http://immich-kiosk:7000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

